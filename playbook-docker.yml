---
- name: Install Docker
  hosts: test
  vars:
    deps_packages:
      - ca-certificates
      - curl
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin  
  tasks:

  - name: Install Certificates
    ansible.builtin.apt:
      name: "{{ deps_packages }}"
      state: present
      update_cache: yes    


  - name: Modify privileges
    ansible.builtin.file:
      mode: 0755
      path: /etc/apt/keyrings
      recurse: yes
      state: directory


  - name: Download Docker GPC key
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/debian/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: a+r

  - name: Ansible Distribution Release
    ansible.builtin.shell:  . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"  
    register: variable_output
      
  - name: Add the repository to Apt sources
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/docker.sources
      content: |
         Types: deb
         URIs: https://download.docker.com/linux/debian
         Suites: {{ variable_output.stdout }}
         Components: stable
         Signed-By: /etc/apt/keyrings/docker.asc
      mode: 0644

  - name: Install Docker Engine and Plugins
    ansible.builtin.apt:
      state: present
      update_cache: yes
      name: "{{ docker_packages }}"


  - name: Docker service
    ansible.builtin.service:
      name: docker
      state: started
      enabled: yes


  - name: Verify correct installation
    ansible.builtin.command: docker run --rm hello-world
    register: output
  
  - name: Mostrar resultado
    ansible.builtin.debug:
      msg: "Docker está funcionando correctamente!"
    when: "'Hello from Docker!' in output.stdout"   
...
