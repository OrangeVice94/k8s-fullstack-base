---

- name: Bootstrap
  hosts: all
  become: true
  vars_files:
    - ../variables/bootstrap.yml
  tasks:
      
    - name: Create group 
      ansible.builtin.group:
        name: "{{ user_ansible }}"
        state: present

    - name: Add group to Sudoers
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ user_ansible }}"
        content: "%{{ user_ansible }} ALL=(ALL) NOPASSWD:ALL"
        mode: 0440
        validate: visudo -cf %s

    - name: Create user
      ansible.builtin.user:
        name: "{{ user_ansible }}"
        groups: "{{ user_ansible }}" 
        append: yes
        shell: /bin/bash

    - name: Add SSH Authorized Key
      ansible.builtin.authorized_key:
        user: "{{ user_ansible }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
      register: ssh_result
      failed_when: false

    - name: Warn if SSH key was not found
      ansible.builtin.fail:
        msg: "SSH public key not found at ~/.ssh/id_rsa.pub. Generate one with ssh-keygen -t rsa -b 4096"
      when: ssh_result is failed    
...
