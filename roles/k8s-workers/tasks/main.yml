---
# References:
# https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/

# Join workers to cluster
 
- name: Generate join command from master
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  delegate_to: "{{ groups['k8s_master'][0] }}"
  run_once: true
  changed_when: false
  tags: [join]

- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf    
  tags: [join]

- name: Verify node is register in cluster
  ansible.builtin.command: kubectl get node {{ inventory_hostname }}
  delegate_to: "{{ groups['k8s_master'][0] }}"
  register: node_registered
  failed_when: false
  changed_when: false
  when: kubelet_conf.stat.exists
  tags: [join]

- name: Reset stale node state
  ansible.builtin.command: kubeadm reset -f
  when:
    - kubelet_conf.stat.exists
    - node_registered.rc != 0 
  tags: [join]

- name: Join cluster
  ansible.builtin.command: "{{ join_command.stdout }}"
  when: not kubelet_conf.stat.exists or node_registered.rc != 0
  tags: [join]

- name: Verify node has joined
  ansible.builtin.command: kubectl get nodes
  delegate_to: "{{ groups['k8s_master'][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  run_once: true
  register: nodes_status
  changed_when: false
  tags: [verify]

- name: Display cluster nodes
  ansible.builtin.debug:
    var: nodes_status.stdout_lines
  run_once: true
  tags: [verify]

...
