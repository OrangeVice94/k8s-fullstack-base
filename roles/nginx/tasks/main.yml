---
# Reference: https://nginx.org/en/linux_packages.html#Debian
# Setup Nginx Reverse Proxy

- name: Install prerequisites for Nginx
  ansible.builtin.apt:
    name: "{{ prerequisites }}"
    state: present
    update_cache: true
  tags: [prerequisites]

- name: Import an official Nginx signing key
  ansible.builtin.shell: >
    curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor 
    -o /usr/share/keyrings/nginx-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/nginx-archive-keyring.gpg
  tags: [prerequisites]
    
- name: Add Nginx official repository
  ansible.builtin.copy:
    content: "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/debian {{ ansible_distribution_release }} nginx\n"

    dest: /etc/apt/sources.list.d/nginx.list
    owner: root
    group: root
    mode: 0644
  tags: [prerequisites]
      
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  tags: [install]

# Prevent unintended upgrades that could affect configuration compatibility.
# To upgrade manually:
# apt-mark unhold nginx && apt upgrade nginx && apt-mark hold nginx

- name: Hold Nginx version to prevent automatic upgrades
  ansible.builtin.dpkg_selections:
    name: nginx
    selection: hold
  tags: [install]

- name: Install OpenSSL for certificate generation
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: true
  tags: [install]

- name: Create SSL directory
  ansible.builtin.file:
    path: "{{ ssl_certificate_directory }}"
    state: directory
    owner: root
    group: root
    mode: 0700
  tags: [ssl]

# Generate a self-signed certificate for development/testing.
# For production, replace this with Let's Encrypt (certbot) or
# provide your own certificate files.

- name: Generate self-signed SSL private key
  ansible.builtin.command: >
    openssl genrsa -out "{{ ssl_certificate_key_path }}" "{{ ssl_key_size }}"
  args: 
    creates: "{{ ssl_certificate_key_path }}"
  tags: [ssl]

- name: Generate self-signed SSL certificate
  ansible.builtin.command: >
    openssl req -new -x509 -key "{{ ssl_certificate_key_path }}" -out "{{ ssl_certificate_path }}" -days 365 -subj "/C=ES/ST=Madrid/L=Madrid/O=K8S-Fullstack/CN={{ server_name }}"
  args: 
    creates: "{{ ssl_certificate_path }}"
  tags: [ssl]

- name: Generate self-signed SSL dhparam
  ansible.builtin.command: >
    openssl dhparam -out "{{ ssl_dhparam }}" "{{ ssl_key_size }}"
  args:  
    creates: "{{ ssl_dhparam }}"
  tags: [ssl]

- name: Set appropriate permissions on SSL private key
  ansible.builtin.file:
    path: "{{ ssl_certificate_key_path }}"
    owner: root
    group: root
    mode: 0600
  tags: [ssl]

- name: Set appropriate permissions on SSL certification
  ansible.builtin.file:
    path: "{{ ssl_certificate_path }}"
    owner: root
    group: root
    mode: 0644
  tags: [ssl]

- name: Set appropriate permissions on SSL dhparam
  ansible.builtin.file:
    path: "{{ ssl_dhparam }}"
    owner: root
    group: root
    mode: 0644
  tags: [ssl]

- name: Deploy Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
    validate: nginx -t -c %s
  notify: "restart nginx"
  tags: [configure]

# Avoid potential compatibility issues with the default
# site configuration listening on port 80.
- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: "restart nginx"
  tags: [configure]

- name: Ensure Nginx is running and enabled on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  tags: [service]

# Accept these status codes as healthy because there may not be
# any application deployed behind the proxy yet.
- name: Verify Nginx is responding
  ansible.builtin.uri: 
    url: "https://localhost:{{ nginx_port }}"
    status_code: [200, 429, 502]
    validate_certs: false
  register: nginx_health
  failed_when: false
  tags: [verify]

- name: Get Nginx version
  ansible.builtin.command: nginx -v
  register: nginx_version
  changed_when: false
  tags: [verify]

- name: Display Nginx status
  ansible.builtin.debug:
    msg: "{{ 'Nginx version: ' + nginx_version.stderr.split('/')[-1] + ' is healthy!' if nginx_health.status in [200, 429, 502] else 'WARNING: Nginx health check failed' }}"
  tags: [verify]

...

