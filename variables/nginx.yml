# variables/nginx.yml

        #**************************
        #*         Server         *
        #**************************

# For development: use the proxy VM IP or a local domain
# For production: use your real domain

server_name: localhost

# Temporaly: will point to K8S workers NodePort once cluster is running
proxy_pass: https://localhost:443

nginx_port: 443

        #**************************
        #*         SSL/TLS        *
        #**************************

ssl_certificate_directory: /etc/nginx/ssl 
ssl_certificate_path: /etc/nginx/ssl/server.crt
ssl_certificate_key_path: /etc/nginx/ssl/server.key
ssl_key_size: 2048
ssl_dhparam: /etc/nginx/ssl/dhparam.pem
ssl_prefer_server_ciphers: "on"
ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

  
  

        #**************************
        #*          Cache        *
        #**************************

worker_processes: auto 
worker_connections: 1024
client_body_buffer_size: 128k
client_max_body_size: 8m
client_header_buffer_size: 1k
client_body_timeout: 12
client_header_timeout: 12
keep_alive_timeout: 15
send_timeout: 10


        #**************************
        #*          GZIP          *
        #**************************

gzip: "on"
gzip_comp_level: 3


        #**************************
        #*       Rate Limit       *
        #**************************
  
zone: MyZone
sizeIPs: 10m
rate: 10r/s
burst: 20



